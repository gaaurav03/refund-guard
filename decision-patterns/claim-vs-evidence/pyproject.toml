[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-vs-evidence"
version = "0.1.0"
description = "Reusable Strands Decider 2B guardrail: check a claim against your evidence before a risky tool runs."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
strands = ["strands-agents==1.61.0"]

[tool.setuptools]
packages = ["claim_vs_evidence"]
