[project]
name = "refund-guard"
version = "0.1.0"
description = "The support agent you can't scam: Strands Decider 2B guards issue_refund before it runs."
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests", "decision-patterns/claim-vs-evidence/tests"]
asyncio_mode = "auto"
markers = [
    "live: needs a running Decider server and/or AWS credentials",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/app/agent/build.py" = ["E501"]  # prompt text
"bench/*.py" = ["E501"]  # case data and fact sentences
"bench/latency_judges.py" = ["E501", "I001"]  # imports run_judges first: it puts backend/ on sys.path
"decision-patterns/claim-vs-evidence/examples/*.py" = ["E501"]  # sample records
"backend/tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["decision-patterns/claim-vs-evidence/claim_vs_evidence", "backend/app/guard", "backend/app/models.py", "backend/app/api.py", "backend/app/security"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "boto3"]
ignore_missing_imports = true
